name: blankroom

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blankroom}
      POSTGRES_USER: ${POSTGRES_USER:-blankroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blankroom_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - blankroom_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blankroom} -d ${POSTGRES_DB:-blankroom}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    image: blankroom-api:local
    build:
      context: ./apps/api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-blankroom}:${POSTGRES_PASSWORD:-blankroom_local}@db:5432/${POSTGRES_DB:-blankroom}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 8
    restart: unless-stopped

  web:
    image: blankroom-web:local
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  blankroom_data:
